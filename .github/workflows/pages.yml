name: Pages

# Builds the static site in web/ and deploys it to GitHub Pages.
# One-time setting (repository Settings -> Pages): Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      # Inert until the repository variable SITE_DATA_TAG names a release that carries
      # `site-data.tar.gz` (docs/runbooks/publish-site.md). Without it the site shows the fixture.
      - name: Download the site data from a release
        if: ${{ vars.SITE_DATA_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_DATA_TAG: ${{ vars.SITE_DATA_TAG }}
        run: |
          gh release download "$SITE_DATA_TAG" --repo "$GITHUB_REPOSITORY" --pattern site-data.tar.gz
          # `._*` are the AppleDouble files that a macOS tar adds; they are not data
          tar -xzf site-data.tar.gz --exclude='._*' -C static
          find static/data -name '._*' -delete
          test -f static/data/meta.json
      - name: Build (served under /<repository name>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_DATA_DIR: ${{ vars.SITE_DATA_TAG != '' && 'data' || 'data-fixture' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
