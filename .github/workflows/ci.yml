name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python version comes from .python-version)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  test-ml:
    name: Tagger tests with the ml extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install with the ml extra (scikit-learn, LightGBM, torch)
        run: uv sync --locked --extra ml
      - name: Tagger tests (the learned fusion and calibration run here, not in the main job)
        run: uv run pytest tests/unit/test_tagging_fusion.py tests/unit/test_tagging_signals.py tests/unit/test_tagging_regression.py -rs

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Prettier and ESLint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build (as on Pages, under a base path)
        run: npm run build
        env:
          BASE_PATH: /flat-atlas

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --redact --verbose
