# Per-source access settings (PLAN §3). All HTTP goes through flatatlas.http, which reads this file.
# Values marked "unverified" come from PLAN §3 and must be re-checked in the first session that
# uses the source; record changes in docs/notes/sources.md.
#
#   requests_per_second / burst  token bucket (conservative where PLAN says unverified)
#   batch_size                   max IDs per batched call (used by the source clients)
#   daily_budget_usd             per UTC day; null = no budget
#   costs                        estimated cost per call kind, in USD
#   auth                         style: none | query | header; name = parameter/header name;
#                                secret = field of the .env settings holding the key;
#                                required = refuse to hit the network without it
#   mailto_param                 query parameter that carries the contact email (polite pools)

dblp:
  base_url: https://dblp.org
  requests_per_second: 1.0      # no published limit; PLAN says <= 1 request/s
  burst: 1
  batch_size: 1
  daily_budget_usd: null
  costs: {}
  auth: {style: none}

openalex:
  base_url: https://api.openalex.org
  requests_per_second: 10.0     # docs: 30/s with a free key (2026-11-15); we stay at 10/s on purpose
  burst: 10
  batch_size: 100               # filter=doi:a|b|... ; 100 is the maximum (101 gives HTTP 400); verified P1-02
  daily_budget_usd: 1.0         # free budget, resets at midnight UTC
  costs:
    list: 0.0001                # $0.10 per 1,000 list/filter calls (header x-ratelimit-cost-usd, P1-02)
    singleton: 0.0              # lookups by ID or DOI are free
    search: 0.001               # $1 per 1,000 search calls
  # from_updated_date / from_created_date are NOT available on the free key (HTTP 429, "Plan upgrade
  # required"): incremental refresh re-fetches by DOI instead (PLAN §5.3).
  auth: {style: query, name: api_key, secret: openalex_api_key, required: true}  # verified P0-03

semanticscholar:
  base_url: https://api.semanticscholar.org/graph/v1
  requests_per_second: 1.0      # key gives 1 request/s on all endpoints
  burst: 1
  batch_size: 100               # POST /paper/batch; PLAN says 500 from memory (unverified), so start lower
  daily_budget_usd: null
  costs: {}
  auth: {style: header, name: x-api-key, secret: s2_api_key, required: false}

crossref:
  base_url: https://api.crossref.org
  requests_per_second: 3.0      # polite pool: 10/s single record, 3/s list queries; use the lower
  burst: 3
  batch_size: 1
  daily_budget_usd: null
  costs: {}
  auth: {style: none}
  mailto_param: mailto
