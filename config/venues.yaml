  name: Descriptional Complexity of Formal Systems
  kind: conference
  tier: core
  dblp_stream: conf/dcfs           # unverified
  openalex_source_ids: [S4306507593, S4306418178]
  publisher: Springer
  first_year: 2002                 # unverified, from memory (PLAN says "about 1999 as DCAGRS")
  successor_of: [dcagrs]
  verified: {dblp: null, openalex: 2026-11-15}
  notes: >
    OpenAlex has two sources: S4306507593 (named "DCFS", typed journal, about 110 works from
    2001) and S4306418178 (about 4 works). Both are kept; the DCFS LNCS volumes are under the
    LNCS series source. Whether FDSR (merged into DCFS) needs its own entry is open until DBLP
    can be checked.

