  publisher: Springer
  first_year: 2000                 # unverified, from memory
  successor_of: [wia]
  verified: {dblp: null, openalex: 2026-11-15}
  notes: >
    The OpenAlex source holds only 2002 papers from the ACM Digital Library; the LNCS volumes
