# The venue registry (PLAN §7). Adding a venue is an entry here, not a code change.
# Validate with: uv run flatatlas venues check
#
# successor_of   venues this one continues (a rename or a merger): ciaa continues wia.
# verified       date each source was checked for this entry. null = the value is still from
#                memory and must not be harvested against. Evidence: docs/notes/venues-pilot.md.
#                  dblp      dblp_stream, first_year, last_year, successor_of
#                  openalex  openalex_source_ids
# openalex_source_ids  OpenAlex files LNCS proceedings under the book series (S106296714), not the
#                conference, so these lists are short and DBLP defines membership (PLAN §8.4).

- id: dlt
  acronym: DLT
  name: Developments in Language Theory
  kind: conference
  tier: core
  dblp_stream: conf/dlt            # unverified: DBLP blocks automated access (venues-pilot.md)
  openalex_source_ids: [S4306418189]
  publisher: Springer
  first_year: 1993                 # unverified, from memory
  successor_of: []
  verified: {dblp: null, openalex: 2026-11-15}
  notes: >
    Proceedings are LNCS, so most papers sit under the LNCS series source in OpenAlex; the
    conference source holds only a small, partly duplicated subset.

