[project]
name = "flatatlas"
version = "0.0.1"
description = "The FLAT Atlas: an open map of formal languages and automata theory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Duarte" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "httpx",
    "numpy>=2.5.5",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "rapidfuzz",
    "tenacity",
    "typer",
]

[project.scripts]
flatatlas = "flatatlas.cli:app"

[project.optional-dependencies]
ml = [
    "adapters>=1.3.0",
    "lightgbm>=4.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3",
    "torch>=2.15.0",
    "transformers>=4.57.6",
    "umap-learn>=0.6.0",
]

# Cascade step 3 (P1-07b): the local decision model runs through llama.cpp. Not needed by the
# tests or CI, which use a fake scorer; the model file is a separate download (docs/notes/sources.md).
llm = [
    "llama-cpp-python>=0.3.16",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML templates read better as one string per table row than wrapped at 100 columns.
"src/flatatlas/evaluate/report.py" = ["E501"]
